
{% extends "base.html" %}
{% block title %}Register | Fresh Juice Store{% endblock %}
{% block content %}
<h1>Create an account</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Register</button>
</form>
<p>Already registered? <a href="{% url 'login' %}">Log in</a></p>
{% endblock %}
